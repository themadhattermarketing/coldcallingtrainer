<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Cold Calling System</title>
    <style>
        /* Global Styles & Dark Theme */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #1a1a2e; /* Dark background */
            color: #e0e0e0; /* Light text color */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewport="0 0 100 100" style="fill: %2300ffff; stroke: %2300ffff;"><circle cx="10" cy="10" r="5" /></svg>') 10 10, auto;
            font-weight: 400; /* Default font weight */
        }

        /* App Container */
        #app-container {
            width: 90%;
            max-width: 1200px;
            background-color: #24243e; /* Slightly lighter dark shade */
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.2); /* Cyan glow effect */
            padding: 20px;
            text-align: center;
            position: relative; /* For absolute positioning of sections */
            overflow: hidden; /* Prevent scrollbars during transitions */
        }

        /* Headings */
        h1 {
            color: #00ffff; /* Neon cyan */
            text-shadow: 0 0 10px #00ffff;
            font-weight: 600; /* Bolder headings */
        }

        /* Buttons (General) */
        button {
            background-color: #7f00ff; /* Neon purple */
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 10px;
            font-size: 1.1em;
            font-family: inherit; /* Ensure buttons use the body font stack */
            font-weight: 600; /* Make button text slightly bolder */
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px #7f00ff, 0 0 20px #7f00ff inset; /* Glow effect */
        }

        button:hover {
            background-color: #9d00ff; /* Lighter purple */
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 15px #9d00ff, 0 0 30px #9d00ff inset;
        }

        /* Start Screen Specifics & Section Transitions */
        #start-screen, #call-interface {
            /* display: flex; /* This will be managed by classes now */
            flex-direction: column;
            align-items: center;
            width: 100%; /* Ensure sections take full width of container */
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            will-change: opacity, transform; /* Performance hint */
        }
        /* #call-interface specific flex properties if needed when visible - already covered by .section-visible */

        .section-hidden {
            opacity: 0 !important;
            transform: scale(0.95) translateY(20px); 
            pointer-events: none !important; 
            position: absolute !important; 
            top: 0; 
            left: 0; 
            /* visibility: hidden; /* Alternative to opacity and pointer-events */
        }
        .section-visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            display: flex !important; 
            position: relative !important; 
        }


        /* Call Interface */
        #script-display {
            background-color: #2c2c54; /* Deep blue */
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            min-height: 100px;
            font-size: 1.2em;
            line-height: 1.6;
            color: #afeeee; /* Pale turquoise for script text */
            text-align: left;
        }

        #prospect-responses button {
            background-color: #00ced1; /* Neon teal */
            box-shadow: 0 0 10px #00ced1, 0 0 20px #00ced1 inset;
        }

        #prospect-responses button:hover {
            background-color: #20b2aa;
            box-shadow: 0 0 15px #20b2aa, 0 0 30px #20b2aa inset;
        }

        /* Objection Handler Widget */
        /* #toggle-objections button styling is covered by general button styles for now */
        #objections-list {
            background-color: #1f1f3d;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: left;
            display: none; /* Initially hidden, JS will toggle */
        }

        /* Note-Taking Tool */
        /* #toggle-notes button styling is covered by general button styles for now */
        #note-tool {
            background-color: #1f1f3d;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            /* display: none; /* Initially hidden by main HTML, will be controlled by JS */
        }

        #note-tool input[type="text"],
        #note-tool textarea {
            width: calc(100% - 22px); /* Account for padding */
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #00ffff; /* Cyan border */
            background-color: #2c2c54;
            color: #e0e0e0;
            font-family: inherit; /* Ensure inputs use body font */
        }
        
        /* #export-notes button styling is covered by general button styles for now */

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            #app-container {
                width: 98%;
                padding: 10px;
            }

            button {
                padding: 12px 20px;
                font-size: 1em;
            }

            h1 {
                font-size: 1.8em;
            }

            #script-display {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Start Screen Section -->
        <section id="start-screen" class="section-visible">
            <h1>Welcome to the Call Assistant</h1>
            <button id="btn-cold-call">Cold Call</button>
            <button id="btn-booked-no-time">Booked Lead, No Time</button>
            <button id="btn-booked-time-selected">Booked Lead, Time Selected</button>
        </section>

        <!-- Call Interface Section (Initially Hidden) -->
        <section id="call-interface" class="section-hidden">
            <div id="script-display">
                <!-- Speech bubble/callout will be dynamically inserted here -->
            </div>
            <div id="prospect-responses">
                <!-- Buttons for prospect responses will be dynamically inserted here -->
            </div>
            <div id="meet-link-area" style="display: none;">
                <!-- Google Meet link will be displayed here -->
            </div>
        </section>

        <!-- Floating Objection Button -->
        <button id="floating-objection-btn" style="display: none; position: fixed; bottom: 20px; right: 20px; z-index: 1000; width: 60px; height: 60px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center;" class="icon-only">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" style="width: 32px; height: 32px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
            </svg>
        </button>

        <!-- Objection Modal -->
        <div id="objection-modal" class="modal hidden" style="display: none;">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <button id="close-objection-modal" class="icon-only" style="position: absolute; top: 15px; right: 15px; background: transparent; border: none; font-size: 1.8em; padding: 5px; width: auto; height: auto; box-shadow: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" style="width: 28px; height: 28px;">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
                <h2>Objection Handler</h2>
                <input type="text" id="objection-search" placeholder="Search objections..." style="width: calc(100% - 20px); margin-bottom: 15px; padding: 10px; border-radius: 5px; border: 1px solid #00ffff; background-color: #2c2c54; color: #e0e0e0; font-family: inherit;">
                <div id="objections-list" style="max-height: 300px; overflow-y: auto; text-align: left; background-color: transparent; padding:0; margin-top:0;">
                    <!-- Objections will be listed here by JS -->
                </div>
            </div>
        </div>

        <!-- Note-Taking Tool (Initially Hidden) -->
        <aside id="note-tool" style="display: none;">
            <button id="toggle-notes">Notes</button>
            <input type="text" id="prospect-name" placeholder="Prospect Name">
            <textarea id="pain-points" placeholder="Pain Points"></textarea>
            <textarea id="objections-raised" placeholder="Objections Raised"></textarea>
            <input type="text" id="outcome" placeholder="Outcome (e.g., Demo booked)">
            <button id="export-notes">Copy Notes</button>
        </aside>
    </div>

    <script>
        // Part 1 & 2: Data Structures, UI Element Toggling, Call Flow Engine, Animations, Utilities

        // 1. Script Data Structures & Objection Data
        const scripts = {
            coldCall: {
                name: "RapidMedical Cold Call Script - Cardone Method", // Updated Name
                initialPromptKey: "coldCall_GK_Opener_New", // Updated Initial Key
                nodes: {
                    // --- Gatekeeper (GK) Path ---
                    "coldCall_GK_Opener_New": {
                        text: "Hey [Gatekeeper Name]! I was trying to reach the owner or Dr. [Last Name] – the person who handles new patient intakes and scheduling. Are they in today?",
                        responses: {
                            "gk_who_is_this": { buttonText: "Who is this? / What's this regarding?", nextNodeKey: "coldCall_GK_IntroduceRapidMedical" },
                            "gk_they_are_busy": { buttonText: "They're busy / Not available", nextNodeKey: "coldCall_GK_HandleBusy" },
                            "gk_puts_through": { buttonText: "Puts you through to DM", nextNodeKey: "coldCall_DM_Opener_New" }
                        }
                    },
                    "coldCall_GK_IntroduceRapidMedical": {
                        text: "Yeah absolutely — my name’s [Your Name], I’m with RapidMedical. They may have heard about us already. We're helping practices like yours eliminate missed calls and get more new patients booked automatically. Just let them know [Your Name] from RapidMedical is on the line for a quick minute.",
                        responses: {
                            "gk_still_busy": { buttonText: "Still says they're busy", nextNodeKey: "coldCall_GK_HandleBusy"},
                            "gk_ask_more_info": { buttonText: "Asks for more info / Send email", nextNodeKey: "coldCall_GK_OfferInfoAndDemo" },
                            "gk_puts_through": { buttonText: "Okay, I'll see / Puts you through", nextNodeKey: "coldCall_DM_Opener_New" }
                        }
                    },
                    "coldCall_GK_HandleBusy": {
                        text: "No problem at all. I know things are hectic. Is there a better time today, perhaps in an hour, or would tomorrow morning be less slammed for a 60-second chat? We're showing practices how to handle 100% of their missed calls without lifting a finger.",
                        responses: {
                            "gk_suggests_time": { buttonText: "Suggests a callback time", nextNodeKey: "coldCall_End_FollowUp_GK_Time" },
                            "gk_still_no_time_send_info": { buttonText: "Still no time / Just send info", nextNodeKey: "coldCall_GK_OfferInfoAndDemo" },
                            "gk_puts_through_eventually": { buttonText: "Actually, let me check / Puts through", nextNodeKey: "coldCall_DM_Opener_New" }
                        }
                    },
                    "coldCall_GK_OfferInfoAndDemo": {
                        text: "Absolutely. I can send over a quick one-pager. But look, most docs find it more impactful to see it live – it takes literally 60 seconds to understand. We’re doing 10-minute demos this week with a few select practices in [City/Area]. We need to get Dr. [Last Name] on one of these 10-minute slots this week. Can you make that happen?",
                        responses: {
                            "gk_tries_to_schedule_demo": { buttonText: "Okay, let me check calendar for demo", nextNodeKey: "coldCall_DM_DemoCTA_New" }, // Straight to booking if GK can
                            "gk_insists_on_info_only": { buttonText: "No, just send the info for now", nextNodeKey: "coldCall_End_SendInfo_GK_WithAITaste" },
                            "gk_not_interested_exit": { buttonText: "Not interested / Firm Exit", nextNodeKey: "coldCall_End_NoSale_GK" }
                        }
                    },

                    // --- Decision Maker (DM) Path ---
                    "coldCall_DM_Opener_New": {
                        text: "Hey Dr. [Last Name], I appreciate you taking the call! My name’s [Your Name] — I’m with RapidMedical. I’ll keep this really short. We help private practices like yours in [City/Area] eliminate missed calls, book more new appointments 24/7, and significantly reduce no-shows with our AI receptionist. Sound like something worth 60 seconds of your time?",
                        responses: {
                            "dm_intrigued_tell_me_more": { buttonText: "Okay, 60 seconds. Tell me more.", nextNodeKey: "coldCall_DM_ValuePropPain" },
                            "dm_what_is_this_exactly": { buttonText: "What is this exactly? AI?", nextNodeKey: "coldCall_DM_ExplainAI" },
                            "dm_im_busy_now": { buttonText: "I'm busy right now.", nextNodeKey: "coldCall_DM_HandleBusy_New" },
                            "dm_not_interested_initial": { buttonText: "Not interested.", nextNodeKey: "coldCall_DM_HandleNotInterested_Initial" }
                        }
                    },
                    "coldCall_DM_ValuePropPain": {
                        text: "Basically, picture this: your phone rings, but your staff is swamped or it's after hours. Our AI answers, sounds just like a top-notch receptionist, and books that appointment. Handles 100% of missed calls. How many calls would you say your practice misses on a busy day or after hours, roughly?",
                        responses: {
                            "dm_answers_missed_calls_low": { buttonText: "Answers (Low / Not many)", nextNodeKey: "coldCall_DM_ValuePropPain_Low" },
                            "dm_answers_missed_calls_high": { buttonText: "Answers (Significant / A lot)", nextNodeKey: "coldCall_DM_ValuePropPain_High" },
                            "dm_skeptical_doesnt_miss_many": { buttonText: "Skeptical / We don't miss many", nextNodeKey: "coldCall_DM_AddressSkepticism_MissedCalls" }
                        }
                    },
                    "coldCall_DM_ValuePropPain_Low": {
                        text: "Okay, even a few can add up. Plus, we also automate appointment reminders and follow-ups to reduce no-shows by up to 30%. And imagine freeing up your front desk staff from those routine calls, so they can focus on the patients right in front of them. Does that resonate at all?",
                        responses: {
                            "dm_agrees_staff_time_valuable": { buttonText: "Yes, staff time is valuable.", nextNodeKey: "coldCall_DM_DemoCTA_New" },
                            "dm_still_not_convinced_low": { buttonText: "Still not sure it's for us.", nextNodeKey: "coldCall_DM_OfferAITaste_ThenDemo" }
                        }
                    },
                    "coldCall_DM_ValuePropPain_High": {
                        text: "Exactly. So those [Number] missed calls? Our AI can convert a good chunk of those into booked appointments, 24/7. Plus, we automate reminders to cut no-shows by up to 30% and free up your front desk for patients in the office. See how that could be a game-changer?",
                        responses: {
                            "dm_sees_potential_high": { buttonText: "I see the potential.", nextNodeKey: "coldCall_DM_DemoCTA_New" },
                            "dm_how_does_it_work_details": { buttonText: "How does that actually work?", nextNodeKey: "coldCall_DM_ExplainAI_Brief" }
                        }
                    },
                    "coldCall_DM_AddressSkepticism_MissedCalls": {
                        text: "I hear you. Many practices we talk to initially feel they have good coverage. But what about calls that come in during lunch, right at closing, or when staff are all tied up? Our AI ensures every single one is handled professionally. Plus, it's not just about missed calls – it's about automating routine bookings and reminders to free up current staff. Would seeing it in action for 2 minutes change your mind?",
                        responses: {
                            "dm_ok_2_min_peek": { buttonText: "Okay, 2 mins to see.", nextNodeKey: "coldCall_DM_OfferAITaste_ThenDemo" },
                            "dm_still_skeptical_exit": { buttonText: "Still don't think we need it.", nextNodeKey: "coldCall_End_NoSale_DM_Polite" }
                        }
                    },
                    "coldCall_DM_ExplainAI": {
                        text: "Correct, it's a HIPAA-compliant AI receptionist. Think of it as the most efficient, always-available staff member you've never had. It answers calls, books appointments directly into your EMR [mention specific EMR if known, otherwise 'your system'], handles FAQs, sends reminders, and even re-books no-shows. Patients love it because it's instant and always professional. Worth seeing how it handles a call?",
                        responses: {
                            "dm_intrigued_by_ai": { buttonText: "Okay, how does it handle a call?", nextNodeKey: "coldCall_DM_OfferAITaste_ThenDemo" },
                            "dm_concerned_about_ai_quality": { buttonText: "Concerned about AI quality/patient experience.", nextNodeKey: "coldCall_DM_AddressAIQuality" },
                            "dm_cost_concern_early": { buttonText: "What does something like this cost?", nextNodeKey: "coldCall_DM_HandleCost_Early" }
                        }
                    },
                    "coldCall_DM_ExplainAI_Brief": {
                        text: "It's simple: a smart AI that integrates with your phone system and EMR. It talks to patients like a real person, books appointments, sends reminders, etc. The beauty is it handles the volume and repetition your staff struggles with. Want to just see it? I can show you in literally 60 seconds.",
                        responses: {
                            "dm_ok_show_me_60s": { buttonText: "Alright, 60 seconds.", nextNodeKey: "coldCall_DM_DemoCTA_New_Urgency" },
                            "dm_still_questions_ai": { buttonText: "More questions about the AI.", nextNodeKey: "coldCall_DM_AddressAIQuality" }
                        }
                    },
                    "coldCall_DM_AddressAIQuality": {
                        text: "Totally valid concern, Dr. [Last Name]. That’s why we offer a live test. Our AI is designed to be indistinguishable from a top-tier human receptionist – always polite, always accurate, and it can even handle different languages/accents. Many practices tell us patients compliment how efficient it is. The best way to judge is to hear it yourself. Can I send a test call to your phone right now?",
                        responses: {
                            "dm_agrees_to_test_call": { buttonText: "Okay, send the test call.", nextNodeKey: "coldCall_DM_AITestCall_Trigger", action: "triggerAICall" },
                            "dm_prefers_live_demo_still": { buttonText: "I'd rather just see a demo.", nextNodeKey: "coldCall_DM_DemoCTA_New" },
                            "dm_skeptical_about_ai_still": { buttonText: "Still skeptical about AI.", nextNodeKey: "coldCall_DM_HandleNotInterested_AIConcern" }
                        }
                    },
                    "coldCall_DM_AITestCall_Trigger": {
                        text: "Great! What’s the best number to send it to? (Prospect gives number) Okay, I’m triggering that now… you should see a call from [Caller ID Name/Number]. Let me know when it comes through... (Pause) ...So, what did you think of that interaction?",
                        responses: {
                            "dm_impressed_by_test": { buttonText: "Impressed / Sounds good!", nextNodeKey: "coldCall_DM_DemoCTA_AfterTest" },
                            "dm_test_was_okay_questions": { buttonText: "It was okay... (has questions)", nextNodeKey: "coldCall_DM_AddressAITestFeedback" },
                            "dm_did_not_receive_test": { buttonText: "Didn't receive it / Problem", nextNodeKey: "coldCall_DM_AITestCall_Troubleshoot" }
                        }
                    },
                    "coldCall_DM_AITestCall_Troubleshoot": {
                        text: "Hmm, sorry about that. Let me double-check the number: [Prospect's Phone Number]? Sometimes cell signals are tricky. Want to try once more, or I can show you a recording of it in a quick screen share as part of the demo?",
                        responses: {
                            "dm_try_test_again": { buttonText: "Try test call again.", nextNodeKey: "coldCall_DM_AITestCall_Trigger", action: "triggerAICall" },
                            "dm_show_recording_in_demo": { buttonText: "Show recording in demo.", nextNodeKey: "coldCall_DM_DemoCTA_New" },
                        }
                    },
                    "coldCall_DM_AddressAITestFeedback": {
                        text: "Appreciate the feedback. That test call is just a glimpse. The real magic happens when it's customized to your practice, using your specific greeting, handling your common questions. That's what the quick 10-minute demo shows. Fair enough to take a look?",
                        responses: {
                            "dm_agrees_to_demo_after_feedback": { buttonText: "Okay, let's see the demo.", nextNodeKey: "coldCall_DM_DemoCTA_New" },
                            "dm_still_not_sold_on_ai": { buttonText: "Still not sold on the AI.", nextNodeKey: "coldCall_End_NoSale_DM_Polite" }
                        }
                    },
                    "coldCall_DM_DemoCTA_AfterTest": {
                        text: "Fantastic! That’s the reaction most doctors have. So, now that you've heard it, let's schedule that quick 10-minute live demo so you can see how it integrates and handles everything else. We’re doing them this week for select practices in [City/Area]. I have [Time 1] or [Time 2] open – which works?",
                        responses: {
                            "dm_books_slot_1": { buttonText: "[Time 1] works.", nextNodeKey: "coldCall_End_Booked_Demo_DM" },
                            "dm_books_slot_2": { buttonText: "[Time 2] works.", nextNodeKey: "coldCall_End_Booked_Demo_DM" },
                            "dm_propose_alt_time_or_now": { buttonText: "Neither work / Can you do now?", nextNodeKey: "coldCall_DM_HandleAltTime_Or_DemoNow" }
                        }
                    },
                    "coldCall_DM_HandleBusy_New": {
                        text: "I totally get it, Dr. [Last Name]. That’s exactly why I called. Practices using RapidMedical free up their staff by 20-30% because our AI handles all the routine calls. When would be a better time for just 60 seconds? Maybe later today around [Suggest Time e.g., 4 PM] or tomorrow morning at [Suggest Time e.g., 9 AM]?",
                        responses: {
                            "dm_agrees_to_later_callback": { buttonText: "Okay, call me [Agreed Time].", nextNodeKey: "coldCall_End_FollowUp_DM_Time" },
                            "dm_still_busy_send_info": { buttonText: "Still too busy, just send info.", nextNodeKey: "coldCall_DM_HandleSendInfo_New" },
                            "dm_not_interested_busy_exit": { buttonText: "Not interested / Too busy (Firm).", nextNodeKey: "coldCall_End_NoSale_DM_Busy" }
                        }
                    },
                    "coldCall_DM_HandleNotInterested_Initial": {
                        text: "Not interested? I get it, Dr. [Last Name]. Sometimes that means 'I'm slammed' or 'I've heard it all.' If I could show you in 30 seconds how practices are booking 5-10 more appointments a week, hands-free, would that be worth a peek? Or what are you using now that you’re happy with?",
                        responses: {
                            "dm_intrigued_by_claim_30s": { buttonText: "Okay, 30 seconds for that claim.", nextNodeKey: "coldCall_DM_ValuePropPain" }, // Back to value prop
                            "dm_shares_current_system": { buttonText: "Shares current system.", nextNodeKey: "coldCall_DM_AcknowledgeCurrentSystem" },
                            "dm_still_not_interested_firm": { buttonText: "Still not interested (Firm).", nextNodeKey: "coldCall_End_NoSale_DM_NotInterested" }
                        }
                    },
                    "coldCall_DM_HandleNotInterested_AIConcern": {
                        text: "I understand the hesitation about AI, Dr. [Last Name]. Many were until they saw *this* AI. It's not like the frustrating bots you've probably encountered. If nothing else, I’ll send you a quick test call that lets you hear the AI in action, no strings attached. If you like it, great. If not, no harm done. Fair?",
                        responses: {
                            "dm_agrees_to_receive_test_call_info": { buttonText: "Okay, send the test call link/info.", nextNodeKey: "coldCall_End_SendInfo_DM_AITaste" },
                            "dm_still_firmly_not_interested_ai": { buttonText: "No thanks, really not interested in AI.", nextNodeKey: "coldCall_End_NoSale_DM_NotInterested" }
                        }
                    },
                    "coldCall_DM_AcknowledgeCurrentSystem": {
                        text: "Okay, you're using [Current System]. Many practices we work with used that too. They find RapidMedical complements it by handling 100% of missed calls and automating the appointment lifecycle in ways [Current System] doesn't, especially after hours. We're not looking to rip and replace, but to add a new layer of efficiency. Worth a 10-min demo to see that difference?",
                        responses: {
                            "dm_agrees_to_demo_comparison": { buttonText: "Okay, show me the difference (10-min demo).", nextNodeKey: "coldCall_DM_DemoCTA_New" },
                            "dm_happy_with_current_exit": { buttonText: "No, we're happy with [Current System].", nextNodeKey: "coldCall_End_NoSale_DM_HappyWithCurrent" }
                        }
                    },
                    "coldCall_DM_HandleSendInfo_New": {
                        text: "Absolutely, Dr. [Last Name]. I’ll send that info right over. I’ll also include a link so you can hear the AI receptionist in action yourself – it’s pretty impressive. To make sure the demo is super relevant if you do want to see it, what’s the biggest challenge: missed calls, no-shows, or staff being tied to phones?",
                        responses: {
                            "dm_answers_challenge_then_info": { buttonText: "Answers challenge (then send info).", nextNodeKey: "coldCall_End_SendInfo_DM_WithChallenge" },
                            "dm_just_send_general_info": { buttonText: "Just send general info.", nextNodeKey: "coldCall_End_SendInfo_DM_Generic" }
                        }
                    },
                    "coldCall_DM_OfferAITaste_ThenDemo": {
                        text: "Perfect. Instead of a boring explanation, how about I send a live test call to your phone right now? You'll hear firsthand how natural and efficient our AI is. Takes 30 seconds. If you like what you hear, we can then jump into that quick 10-min demo. Sound good?",

        // Ensure allObjections is comprehensive based on the scripts above
        const allObjections = {
            "Too expensive": "Totally understand that budget is key. Most practices find that RapidMedical pays for itself within X months just by reducing no-shows by Y% and optimizing the schedule to see Z more patients. Could I show you a quick ROI calculation based on your practice size, or discuss what a comfortable budget for solving [Problem Area] would look like for you?",

            "I'm too busy right now": "Completely understand, Dr. [Last Name]. My goal isn't to take up your valuable time now, but to find just 15 minutes later where I can show you how RapidMedical can actually save you and your staff hours each week. Would [Alt Time 1] or [Alt Time 2] work for a brief online look? Or I can send a 2-minute video demo if that's better.",
            "Not interested": "I get it, 'not interested' can mean a lot of things. Sometimes it's 'happy with current setup,' other times it's 'heard it all before and wasn't impressed.' If you could share one thing about your current patient scheduling or reminder system that you wish was better or less time-consuming, what would it be? Perhaps I can speak to that specifically.",
            "Send me more information": "Happy to. To make sure I send the most relevant information and not just a generic brochure, could you tell me what aspect you're most interested in? Is it reducing no-shows, automating appointment bookings, handling routine patient queries, or something else? Once I know that, I can send a targeted email, perhaps with a short video showing exactly that.",
            "Is this like [Competitor X]?": "That's a great question, and we do get compared to [Competitor X] sometimes as we both aim to improve practice efficiency. However, RapidMedical differentiates itself with [Unique Selling Point 1, e.g., our highly intuitive AI that patients actually prefer interacting with] and [Unique Selling Point 2, e.g., our proactive waitlist management that automatically fills cancelled slots in real-time]. Many of our clients who looked at or even used [Competitor X] chose us because of these distinct advantages. Would you be open to seeing those differences in a quick comparison?",
            "We don't have a problem with no-shows": "That's excellent, it sounds like you're doing a great job with patient compliance! That’s a strong foundation. Beyond just no-shows, many practices use RapidMedical to automatically fill last-minute cancellations without staff intervention, optimize their overall schedule density for better resource use, and reduce the sheer volume of routine calls your staff handles for things like appointment confirmations or basic FAQs. Could any of those areas offer potential for even greater efficiency in your practice?",
            "How do I know patients will like an AI?": "That's a very valid concern. We've designed our AI to be incredibly intuitive and conversational – patients often say it feels like talking to a very efficient and polite human. It understands natural language, can handle various accents, and is available 24/7. Plus, for sensitive issues, it can always seamlessly transfer to live staff. We also provide full transparency and customization in the scripting. Many practices report higher patient satisfaction with appointment booking convenience. We can even do a test call to your phone to show you.",
            "What about HIPAA compliance and data security?": "Top priority. RapidMedical is fully HIPAA compliant. All data is encrypted in transit and at rest, and we adhere to stringent security protocols, including regular audits and [mention specific security measures if known, e.g., SOC 2 compliance]. We can provide full documentation on our security and compliance measures.",
            "Implementation sounds like a headache.": "We've made implementation surprisingly simple. For many EMRs, we have direct API integrations. For others, our system can work as a lightweight layer on top without deep changes to your existing workflow. Our onboarding team handles the heavy lifting, and we can typically get a practice up and running within [Timeframe, e.g., 3-5 business days] with minimal disruption. We provide full training and support."
        };

        let currentScript = null;
        let currentNodeKey = null;
        let animationTimeoutId = null; // For clearing text animation

        // 2. DOM Element References (assuming these are already defined from previous step)
        const startScreen = document.getElementById('start-screen');
        const callInterface = document.getElementById('call-interface');

        const btnColdCall = document.getElementById('btn-cold-call');
        const btnBookedNoTime = document.getElementById('btn-booked-no-time');
        const btnBookedTimeSelected = document.getElementById('btn-booked-time-selected');

        const scriptDisplay = document.getElementById('script-display');
        const prospectResponses = document.getElementById('prospect-responses');

        // const toggleObjections = document.getElementById('toggle-objections'); 
        const objectionsList = document.getElementById('objections-list'); // This is now inside the modal
        // const objectionWidget = document.getElementById('objection-widget'); 

        // New DOM Elements for Objection Modal
        const floatingObjectionBtn = document.getElementById('floating-objection-btn'); // ID confirmed
        const objectionModal = document.getElementById('objection-modal'); // ID confirmed
        const closeModalBtn = document.getElementById('close-objection-modal');  // ID confirmed
        const objectionSearchInput = document.getElementById('objection-search'); // ID confirmed
        const modalBackdrop = document.querySelector('#objection-modal .modal-backdrop'); // Selector confirmed


        const toggleNotes = document.getElementById('toggle-notes');
        const noteTool = document.getElementById('note-tool'); 

        const prospectNameInput = document.getElementById('prospect-name');
        const painPointsInput = document.getElementById('pain-points');
        const objectionsRaisedInput = document.getElementById('objections-raised');
        const outcomeInput = document.getElementById('outcome');
        const exportNotesButton = document.getElementById('export-notes');

        const meetLinkArea = document.getElementById('meet-link-area');

        // 3. Initial UI State Function (mostly unchanged)
        function resetToStartScreen() {
            // Use classes for main section visibility
            startScreen.classList.remove('section-hidden');
            startScreen.classList.add('section-visible');
            callInterface.classList.add('section-hidden');
            callInterface.classList.remove('section-visible');
            
            floatingObjectionBtn.style.display = 'none'; 
            if (floatingObjectionBtn) floatingObjectionBtn.style.display = 'none'; 
            if (objectionModal) {
                objectionModal.classList.add('hidden'); 
                objectionModal.style.display = 'none'; 
            }

            if (noteTool) noteTool.style.display = 'none';      
            if (meetLinkArea) meetLinkArea.style.display = 'none';
            // Clear content
            if(animationTimeoutId) clearTimeout(animationTimeoutId);
            scriptDisplay.innerHTML = '';
            prospectResponses.innerHTML = '';
            // objectionsList is populated once, so no need to clear here unless dynamically adding based on script
            
            prospectNameInput.value = '';
            painPointsInput.value = '';
            objectionsRaisedInput.value = '';
            outcomeInput.value = '';

            currentScript = null;
            currentNodeKey = null;
        }

        // 4. Start Screen Button Logic (updated to call full displayCurrentScriptNode)
        function initializeCallInterface(scriptType) {
            // Use classes for main section visibility
            startScreen.classList.add('section-hidden');
            startScreen.classList.remove('section-visible');
            callInterface.classList.remove('section-hidden');
            callInterface.classList.add('section-visible');
            
            if (floatingObjectionBtn) floatingObjectionBtn.style.display = 'flex'; // Changed to flex to help center icon if needed
            
            if (noteTool) noteTool.style.display = 'block'; 
            const noteToolChildren = noteTool ? Array.from(noteTool.children) : [];
            noteToolChildren.forEach(child => {
                if (child.id !== 'toggle-notes') { 
                    child.style.display = 'none';
                }
            });


            currentScript = scripts[scriptType];
            if (!currentScript || !currentScript.nodes || !currentScript.initialPromptKey) {
                console.error("Selected script or its initial node key is not properly defined:", scriptType, currentScript);
                resetToStartScreen();
                alert("Error: Script data is missing or corrupted. Please check console.");
                return;
            }
            currentNodeKey = currentScript.initialPromptKey;
            
            displayCurrentScriptNode(); 
        }

        btnColdCall.addEventListener('click', () => initializeCallInterface('coldCall'));
        btnBookedNoTime.addEventListener('click', () => initializeCallInterface('bookedNoTime'));
        btnBookedTimeSelected.addEventListener('click', () => initializeCallInterface('bookedTimeSelected'));

        // --- Part 2: Call Flow Engine, Animations, and Utilities ---

        // 2. Implement displayCurrentScriptNode() (Now fully implemented)
        function displayCurrentScriptNode() {
            if (animationTimeoutId) {
                clearTimeout(animationTimeoutId);
            }
            scriptDisplay.innerHTML = '';
            prospectResponses.innerHTML = '';

            if (!currentScript || !currentNodeKey || !currentScript.nodes || !currentScript.nodes[currentNodeKey]) {
                console.error("Error: Invalid script, node key, or nodes structure.", currentScript, currentNodeKey);
                alert("Script error. Resetting.");
                resetToStartScreen();
                return;
            }

            const node = currentScript.nodes[currentNodeKey];

            displayTextWithAnimation(scriptDisplay, node.text);

            if (node.responses) {
                for (const respKey in node.responses) {
                    const responseDetails = node.responses[respKey];
                    const button = document.createElement('button');
                    button.textContent = responseDetails.buttonText;
                    button.addEventListener('click', () => {
                        currentNodeKey = responseDetails.nextNodeKey;
                        displayCurrentScriptNode(); // Recursive call
                        if (responseDetails.action) {
                            handleAction(responseDetails.action);
                        }
                    });
                    prospectResponses.appendChild(button);
                }
            } else if (node.action) {
                // If no responses but there's an action (typically an endCall action)
                handleAction(node.action); // This will often add a "Start New Call" button
            } else {
                // Truly an end of a branch with no action
                const endButton = document.createElement('button');
                endButton.textContent = "Call Ended - Reset";
                endButton.addEventListener('click', resetToStartScreen);
                prospectResponses.appendChild(endButton);
            }
        }

        // 3. Implement displayTextWithAnimation(element, text)
        function displayTextWithAnimation(element, text) {
            if (animationTimeoutId) {
                clearTimeout(animationTimeoutId);
            }
            element.innerHTML = ''; // Clear previous text
            const chars = text.split('');
            let i = 0;
            function typeChar() {
                if (i < chars.length) {
                    element.textContent += chars[i];
                    i++;
                    animationTimeoutId = setTimeout(typeChar, 25); // Adjust speed: 20-30ms
                }
            }
            typeChar();
        }

        // 4. Implement handleAction(action)
        function handleAction(action) {
            switch (action) {
                case 'generateMeetLink':
                    meetLinkArea.innerHTML = ''; // Clear previous
                    meetLinkArea.style.display = 'block';
                    const link = 'https://meet.google.com/new';
                    const a = document.createElement('a');
                    a.href = link;
                    a.target = '_blank';
                    a.textContent = "Open Google Meet";
                    a.style.color = "#00ffff"; 
                    a.style.marginRight = "10px";

                    const copyButton = document.createElement('button');
                    copyButton.textContent = 'Copy Link';
                    copyButton.style.marginLeft = "10px"; // Add some space
                    copyButton.addEventListener('click', () => {
                        navigator.clipboard.writeText(link).then(() => {
                            alert('Google Meet link copied to clipboard!');
                        }).catch(err => {
                            console.error('Failed to copy link: ', err);
                            alert('Failed to copy link. Please copy manually.');
                        });
                    });
                    meetLinkArea.appendChild(a);
                    meetLinkArea.appendChild(copyButton);
                    break;
                case 'triggerAICall':
                    alert("AI Test Call would be triggered here (simulation).");
                    break;
                case 'endCall_Booked':
                case 'endCall_FollowUp':
                case 'endCall_NoSale':
                    const outcomeMessage = action.replace('endCall_', '').replace(/([A-Z])/g, ' $1').trim(); // Format outcome
                    displayTextWithAnimation(scriptDisplay, `Outcome: ${outcomeMessage}. Call ended.`);
                    prospectResponses.innerHTML = ''; // Clear any previous response buttons
                    
                    const newCallButton = document.createElement('button');
                    newCallButton.textContent = "Start New Call";
                    newCallButton.addEventListener('click', resetToStartScreen);
                    prospectResponses.appendChild(newCallButton);
                    meetLinkArea.style.display = 'none'; // Hide meet link area on call end
                    break;
                default:
                    console.warn("Unknown action:", action);
            }
        }

        // 5. Widget Toggling Logic 
        // Objection Modal Toggling
        if (floatingObjectionBtn) floatingObjectionBtn.addEventListener('click', () => {
            if (objectionModal) {
                objectionModal.classList.remove('hidden');
                objectionModal.style.display = 'flex'; 
            }
        });

        if (closeModalBtn) closeModalBtn.addEventListener('click', () => { 
            if (objectionModal) {
                objectionModal.classList.add('hidden');
                objectionModal.style.display = 'none';
            }
        });

        if (modalBackdrop) modalBackdrop.addEventListener('click', () => { 
            if (objectionModal) {
                objectionModal.classList.add('hidden');
                objectionModal.style.display = 'none';
            }
        });

        // Note Toggling (remains largely the same)
        if (toggleNotes) toggleNotes.addEventListener('click', () => {
            if (!noteTool) return;
            const noteToolChildren = Array.from(noteTool.children);
            let allCurrentlyHidden = true;
            noteToolChildren.forEach(child => {
                if (child.id !== 'toggle-notes' && child.style.display !== 'none' && child.style.display !== '') {
                    allCurrentlyHidden = false; 
                }
            });

            noteToolChildren.forEach(child => {
                if (child.id !== 'toggle-notes') { // Don't hide/show the button itself
                    if (allCurrentlyHidden) { // If all were hidden (or first click), show them
                        child.style.display = 'block'; 
                    } else { // Otherwise, hide them
                        child.style.display = 'none';
                    }
                }
            });
        });


        // New: Objection Search/Filter Functionality
        if (objectionSearchInput) objectionSearchInput.addEventListener('input', () => { 
            if (!objectionsList) return;
            const searchTerm = objectionSearchInput.value.toLowerCase(); 
            const items = objectionsList.getElementsByTagName('div'); 

            Array.from(items).forEach(item => {
                const itemText = item.textContent || item.innerText;
                if (itemText.toLowerCase().includes(searchTerm)) {
                    item.style.display = ""; 
                } else {
                    item.style.display = "none";
                }
            });
        });

        // 5. Populate Objection Handler (`populateObjectionsWidget()`)
        // This function now populates the list inside the modal.
        function populateObjectionsWidget() {
            if (!objectionsList) return; // Guard clause
            objectionsList.innerHTML = ''; 
            for (const key in allObjections) {
                if (allObjections.hasOwnProperty(key)) {
                    const div = document.createElement('div');
                    // InnerHTML will be structured for CSS: <strong>Title</strong>Rebuttal Text
                    div.innerHTML = `<strong>${key}</strong>${allObjections[key]}`; 
                    objectionsList.appendChild(div);
                }
            }
        }


        // 6. Note-Taking Tool (`exportNotes` button)
        if (exportNotesButton) exportNotesButton.addEventListener('click', () => {
            const notes = `Prospect Name: ${prospectNameInput.value}\nPain Points: ${painPointsInput.value}\nObjections Raised: ${objectionsRaisedInput.value}\nOutcome: ${outcomeInput.value}`;
            navigator.clipboard.writeText(notes).then(() => {
                alert('Notes copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy notes: ', err);
                alert('Failed to copy notes. Please copy manually.');
            });
        });
        
        // Initial calls on script load
        populateObjectionsWidget(); // Populate objections once
        resetToStartScreen(); // Set initial UI

    </script>
